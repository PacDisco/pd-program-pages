name = "pd-program-pages"
main = "worker.js"
compatibility_date = "2026-09-01"

# Only program and landing-page URLs run through the Worker; the rest of the site is untouched.
routes = [
  { pattern = "www.pacificdiscovery.org/programs/*", zone_name = "pacificdiscovery.org" },
  { pattern = "www.pacificdiscovery.org/lp/*", zone_name = "pacificdiscovery.org" }
]

[vars]
# The pd-program-pages Netlify site (or a custom domain pointed at it).
PROGRAM_SITE = "https://pd-program-pages.netlify.app"
# Page whose header/footer is reused when the PHP site has no page at this URL yet.
SHELL_PATH = "/programs"
# Height of the site's fixed header, so the program's sticky bar sits directly
# under it. The header is 60px up to 1024px wide and 90px from 1025px (the site's
# own breakpoint), so it takes two values.
STICKY_TOP = "60px"
STICKY_TOP_WIDE = "90px"
STICKY_WIDE_FROM = "1025px"
# Leave empty in production. For a preview, run:
#   npx wrangler dev --var PREVIEW_ORIGIN:https://www.pacificdiscovery.org
# and open http://localhost:8787/programs/south-america-gap-semester
PREVIEW_ORIGIN = ""
